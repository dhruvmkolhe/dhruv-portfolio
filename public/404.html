<!DOCTYPE html>
<html lang=en>
  <head>
    <meta charset=UTF-8 />
    <meta name=viewport content=width=device-width, initial-scale=1.0 />
    <title>404: Page Not Found | Dhruv Kolhe</title>
    <meta name=description content=The requested page could not be found. Return to Dhruv Kolhe's developer portfolio to explore featured software projects, technical skills, and contact info. />
    <meta name=robots content=noindex, follow />
    <link rel=icon type=image/svg+xml href=/favicon.svg />
    <link rel=shortcut icon href=/favicon.ico />
    <link rel=preconnect href=https://fonts.googleapis.com />
    <link rel=preconnect href=https://fonts.gstatic.com crossorigin />
    <link href=https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400;1,6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap rel=stylesheet />

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #FDF6EC;
        --fg: #231F20;
        --primary: #C95234;
        --primary-fg: #FFFFFF;
        --secondary: #6D9E6A;
        --accent: #F2C14E;
        --card: #FFFFFF;
        --border: #E8DFD5;
        --muted: #8C827A;
      }
      body {
        font-family: Plus Jakarta Sans, -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg);
        color: var(--fg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem;
        position: relative;
        overflow-x: hidden;
      }
      /* Floating Memphis background accents */
      .shape-1 {
        position: absolute;
        top: 4rem;
        left: 3rem;
        width: 4rem;
        height: 4rem;
        border-radius: 50%;
        background-color: rgba(201, 82, 52, 0.12);
        pointer-events: none;
      }
      .shape-2 {
        position: absolute;
        bottom: 5rem;
        right: 4rem;
        width: 5rem;
        height: 5rem;
        border-radius: 1rem;
        background-color: rgba(109, 158, 106, 0.15);
        transform: rotate(15deg);
        pointer-events: none;
      }
      .shape-3 {
        position: absolute;
        top: 25%;
        right: 20%;
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 50%;
        border: 4px solid rgba(242, 193, 78, 0.35);
        pointer-events: none;
      }
      header {
        width: 100%;
        max-width: 1100px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 0;
        z-index: 10;
      }
      .logo {
        font-family: Newsreader, Georgia, serif;
        font-size: 1.5rem;
        font-weight: 700;
        text-decoration: none;
        color: var(--fg);
      }
      .logo span {
        color: var(--primary);
      }
      main {
        max-width: 600px;
        width: 100%;
        text-align: center;
        margin: auto;
        padding: 2rem 0;
        position: relative;
        z-index: 10;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.375rem 1rem;
        border-radius: 9999px;
        background: rgba(201, 82, 52, 0.1);
        border: 1px solid rgba(201, 82, 52, 0.2);
        color: var(--primary);
        font-size: 0.8125rem;
        font-weight: 600;
        margin-bottom: 1.5rem;
      }
      .badge svg {
        width: 0.875rem;
        height: 0.875rem;
        animation: spin 12s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      h1 {
        font-family: Newsreader, Georgia, serif;
        font-size: clamp(5rem, 14vw, 8.5rem);
        font-weight: 700;
        color: var(--primary);
        line-height: 0.9;
        margin-bottom: 0.75rem;
        user-select: none;
      }
      h2 {
        font-family: Newsreader, Georgia, serif;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        font-weight: 700;
        color: var(--fg);
        margin-bottom: 1rem;
      }
      p {
        color: var(--muted);
        font-size: clamp(0.9375rem, 2vw, 1.0625rem);
        line-height: 1.6;
        margin-bottom: 2.25rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        cursor: pointer;
        border: none;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .btn-primary {
        background-color: var(--primary);
        color: var(--primary-fg);
        box-shadow: 0 1px 3px rgba(201, 82, 52, 0.2);
      }
      .btn-primary:hover {
        box-shadow: 0 4px 12px rgba(201, 82, 52, 0.3);
      }
      .btn-secondary {
        background-color: var(--card);
        color: var(--fg);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover {
        background-color: rgba(0, 0, 0, 0.03);
      }
      .btn-accent {
        background-color: #E2B23F;
        color: #231F20;
      }
      .btn-accent:hover {
        background-color: #D4A330;
      }
      footer {
        font-size: 0.75rem;
        color: var(--muted);
        font-family: JetBrains Mono, monospace;
        text-align: center;
        padding: 1rem 0;
        z-index: 10;
      }
    </style>

    <script>
      // Single Page Application (SPA) Path Recovery for GitHub Pages
      (function() {
        var path = window.location.pathname;
        // Known portfolio section routes
        var sections = ['about', 'skills', 'projects', 'contact'];
        var cleanPath = path.replace(/^\/|\/$/g, '');
        if (sections.indexOf(cleanPath) !== -1) {
          window.location.replace('/#' + cleanPath);
        }
      })();
    </script>
  </head>
  <body>
    <div class=shape-1></div>
    <div class=shape-2></div>
    <div class=shape-3></div>

    <header>
      <a href=/ class=logo>kolhe<span>.</span></a>
    </header>

    <main>
      <div class="badge">
        <svg viewBox="0 0 512 512" fill="currentColor">

        </svg>
        <span>error 404 • page not found</span>
      </div>

      <h1>404</h1>
      <h2>looks like you took a wrong turn.</h2>
      <p>
        The page or file you are looking for doesn't exist, has been moved, or got lost in code. Don't worry — no bugs were harmed!
      </p>

      <div class="actions">
        <a href="/" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 576 512" fill="currentColor">
            <path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 17-14 32.2-32 32.2h-64c-17.7 0-32-14.3-32-32V352h-64v96c0 17.7-14.3 32-32 32h-64c-17.7 0-32-14.3-32-32V287.6H32c-18 0-32-14-32-32.1c0-9 3-17 10-24L266.4 8c7-7 15-8 22-8s15 2 21 7L564.8 231.5c8 7 12 15 11 24z"/>
          </svg>
          take me home
        </a>
        <a href="/#projects" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 640 512" fill="currentColor">
            <path d="M392.8 1.2c-17-4.9-34.7 5-39.6 22l-128 448c-4.9 17 5 34.7 22 39.6s34.7-5 39.6-22l128-448c4.9-17-5-34.7-22-39.6zm80.6 120.1c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L514.7 256 428.1 342.6c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l112-112c12.5-12.5 12.5-32.8 0-45.3l-112-112zm-306.8 0l-112 112c-12.5 12.5-12.5 32.8 0 45.3l112 112c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L125.3 256l86.6-86.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0z"/>
          </svg>
          see projects
        </a>
        <a href="/#contact" class="btn btn-accent">
          <svg width="14" height="14" viewBox="0 0 512 512" fill="currentColor">
            <path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48L48 64zM0 176L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-208L304.7 341.3c-28.4 21.3-67 21.3-95.4 0L0 176z"/>
          </svg>
          contact me
        </a>
      </div>
    </main>

    <footer>
      © 2026 Dhruv Kolhe • All rights reserved.
    </footer>
  </body>
</html>
